<!doctype html>
<html lang="en">

<title>Pi arro000 flavour</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 3rem 1rem; color: #f8f8f2; background: #1f201b;
    font: 1rem/1.6 ui-monospace, monospace;
  }

  }
  main { position: relative; max-width: 43rem; margin: auto; }
  header, figure { text-align: center; }
  h1 { color: #f92672; font-size: clamp(1.45rem, 6vw, 2.5rem); margin: 0; }
  h2 { color: #fd971f; font-size: 1rem; }
  p { margin: .4rem 0; }
  figure { margin: 2rem 0; }
  #torus { margin: 0; color: #a6e22e; font: clamp(.58rem, 2.45vw, 1rem)/1.1 monospace; }
  .guide pre { overflow-x: auto; padding: .65rem; background: #272822; }
  .guide pre:has(+ .copy-command) { margin-bottom: .25rem; }
  .guide { margin-top: 2rem; }
  .copy-command { padding: .15rem .55rem; font-size: .8rem; }
  .copy-command:hover, .copy-command:focus-visible { border-color: #a6e22e; }
  .copy-status { margin-left: .5rem; color: #a6e22e; font-size: .8rem; }
  button { background: transparent; border: 1px solid #75715e; color: #f8f8f2; font: inherit; }
  a { color: #66d9ef; }
  ul { padding-left: 1.2em; overflow-wrap: anywhere; }
  @media (min-width: 43rem) { ul { columns: 2; } }

<main>
  <header>
    <h1>Pi arro000 flavour</h1>
    <p>Install Pi with arro000’s extensions, theme and settings.</p>
    <a href="https://github.com/arro000/pi-arro000-flavour-install#installation">Install</a>
  </header>
  <figure>
    <pre id="torus" aria-hidden="true"></pre>

<!-- usage-guide -->
  </section>
